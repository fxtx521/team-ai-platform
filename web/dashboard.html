<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务看板 · 团队 AI 工作台</title>
<!-- 内联 CSS + 零外链资源：内网可离线跑，不依赖任何远程字体或脚本服务 -->
<style>
  :root {
    --bg: #0D1A2A;
    --panel: #132A42;
    --panel-soft: #172F49;
    --line: #1E3A55;
    --primary: #00B4D8;
    --primary-weak: rgba(0, 180, 216, 0.12);
    --gold: #FFB703;
    --gold-weak: rgba(255, 183, 3, 0.12);
    --text: #E6F1F8;
    --text-dim: #8FA9BE;
    --danger: #FF6B6B;
    --ok: #38D996;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(0, 180, 216, 0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: rgba(13, 26, 42, 0.85);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(6px);
  }

  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: 0.5px; }

  .brand-mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    display: grid; place-items: center;
    background: var(--primary-weak);
    border: 1px solid rgba(0, 180, 216, 0.35);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
  }

  .topbar .who {
    margin-left: auto;
    color: var(--text-dim);
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .topbar .who b { color: var(--text); font-weight: 600; }

  .ghost-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
  }

  .ghost-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* ---------- 布局：左主体 + 右待办 ---------- */
  .wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding: 20px 24px 48px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 1000px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel-soft), var(--panel));
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }

  .panel-head h2 { font-size: 14.5px; margin: 0; font-weight: 700; letter-spacing: 0.3px; }

  .panel-head .tail { margin-left: auto; color: var(--text-dim); font-size: 12px; }

  /* ---------- 终端状态卡 ---------- */
  .status-card { padding: 18px; display: grid; gap: 16px; }

  .status-main { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text-dim);
    box-shadow: 0 0 0 4px rgba(143, 169, 190, 0.12);
    flex: none;
  }

  .dot.online { background: var(--ok); box-shadow: 0 0 0 4px rgba(56, 217, 150, 0.14); }
  .dot.degraded { background: var(--gold); box-shadow: 0 0 0 4px var(--gold-weak); }
  .dot.offline { background: var(--danger); box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.14); }
  .dot.checking { background: var(--primary); animation: pulse 1.2s ease-in-out infinite; }

  @keyframes pulse { 50% { opacity: 0.35; } }

  .status-title { font-size: 20px; font-weight: 700; line-height: 1.2; }

  .status-sub { color: var(--text-dim); font-size: 12.5px; }

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .metric { background: rgba(9, 20, 32, 0.55); padding: 11px 14px; }
  .metric dt { color: var(--text-dim); font-size: 12px; margin: 0 0 2px; }
  .metric dd { margin: 0; font-size: 13.5px; font-variant-numeric: tabular-nums; word-break: break-all; }

  /* ---------- 任务表 ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .toolbar .count { color: var(--text-dim); font-size: 12.5px; }
  .toolbar .spacer { margin-left: auto; }

  .tbl-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  th, td { text-align: left; padding: 11px 18px; border-bottom: 1px solid rgba(30, 58, 85, 0.7); white-space: nowrap; }

  th { color: var(--text-dim); font-weight: 600; font-size: 12px; letter-spacing: 0.4px; background: rgba(9, 20, 32, 0.35); }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(0, 180, 216, 0.05); }

  td.title-cell { white-space: normal; min-width: 220px; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-dim); }

  .badge {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    border: 1px solid transparent;
    line-height: 1.8;
  }

  /* 隐私分档的三种类型沿用同一套语义色：本地=青 标准=灰蓝 高敏=金 */
  .badge.local { color: var(--primary); background: var(--primary-weak); border-color: rgba(0, 180, 216, 0.3); }
  .badge.standard { color: #A9C3DA; background: rgba(169, 195, 218, 0.1); border-color: rgba(169, 195, 218, 0.25); }
  .badge.sensitive { color: var(--gold); background: var(--gold-weak); border-color: rgba(255, 183, 3, 0.3); }

  .st { display: inline-flex; align-items: center; gap: 6px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .st.queued { color: var(--text-dim); }
  .st.running { color: var(--primary); }
  .st.done { color: var(--ok); }
  .st.failed { color: var(--danger); }
  .st.cancelled { color: #7A8A99; }

  /* ---------- 空态/错误态 ---------- */
  .empty { padding: 44px 24px; text-align: center; color: var(--text-dim); }
  .empty .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .empty .note { font-size: 12.5px; max-width: 460px; margin: 8px auto 0; line-height: 1.7; }
  .empty code { background: rgba(0, 0, 0, 0.35); padding: 1px 6px; border-radius: 5px; color: var(--gold); }

  /* ---------- 右侧待办 ---------- */
  .todo-list { padding: 8px 18px 18px; }
  .todo-list li {
    list-style: none;
    display: flex;
    gap: 9px;
    padding: 9px 0;
    border-bottom: 1px dashed rgba(30, 58, 85, 0.9);
    font-size: 13px;
  }
  .todo-list ul { margin: 0; padding: 0; }
  .todo-list li:last-child { border-bottom: none; }
  .todo-list .idx { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
  .todo-placeholder { color: var(--text-dim); font-size: 12.5px; padding: 14px 18px 20px; }
  .todo-placeholder b { color: var(--text); font-weight: 600; }

  .footer-note { color: var(--text-dim); font-size: 11.5px; padding: 0 18px 16px; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><span class="brand-mark" aria-hidden="true">AI</span>团队 AI 工作台</span>
  <div class="who">
    <span>终端 <b id="who-terminal">—</b></span>
    <button id="logout-btn" class="ghost-btn" type="button">退出登录</button>
  </div>
</header>

<div class="wrap">
  <main>
    <!-- 终端状态卡：先回答"我这边能不能干活"，再看任务 -->
    <section class="panel" aria-labelledby="status-heading">
      <div class="panel-head">
        <h2 id="status-heading">终端状态</h2>
        <span class="tail" id="status-time">—</span>
      </div>
      <div class="status-card">
        <div class="status-main">
          <span class="dot checking" id="status-dot" aria-hidden="true"></span>
          <div>
            <div class="status-title" id="status-title">正在检测…</div>
            <div class="status-sub" id="status-sub">正在连接服务端</div>
          </div>
        </div>
        <dl class="metrics">
          <div class="metric"><dt>服务端</dt><dd id="m-base">—</dd></div>
          <div class="metric"><dt>往返延迟</dt><dd id="m-latency">—</dd></div>
          <div class="metric"><dt>服务端时间</dt><dd id="m-server-time">—</dd></div>
          <div class="metric"><dt>队列长度</dt><dd id="m-queue">—</dd></div>
        </dl>
      </div>
    </section>

    <!-- 任务列表：10 秒一轮自动刷新 -->
    <section class="panel" aria-labelledby="tasks-heading" style="margin-top:18px">
      <div class="panel-head">
        <h2 id="tasks-heading">任务列表</h2>
        <span class="tail" id="tasks-updated">尚未加载</span>
      </div>
      <div class="toolbar">
        <span class="count" id="tasks-count">共 0 条</span>
        <span class="spacer"></span>
        <button id="refresh-btn" class="ghost-btn" type="button">立即刷新</button>
      </div>
      <div class="tbl-scroll">
        <table id="tasks-table" hidden>
          <thead>
            <tr>
              <th scope="col">任务 ID</th>
              <th scope="col">标题</th>
              <th scope="col">类型</th>
              <th scope="col">状态</th>
              <th scope="col">创建时间</th>
            </tr>
          </thead>
          <tbody id="tasks-body"></tbody>
        </table>
      </div>
      <div id="tasks-state" class="empty">
        <div class="big">正在加载任务…</div>
      </div>
    </section>
  </main>

  <!-- 右侧待办：现在从任务态推导，编排器上线后换成真正的审批/复核队列 -->
  <aside class="panel" aria-labelledby="todo-heading">
    <div class="panel-head">
      <h2 id="todo-heading">我的待办</h2>
    </div>
    <div id="todo-body" class="todo-list">
      <p class="todo-placeholder">暂无待办。</p>
    </div>
    <p class="footer-note">待办由任务状态推导（排队/执行中）；审批与产物复核接入编排器后开放。</p>
  </aside>
</div>

<script>
(function () {
  "use strict";

  // 与 index.html 共用同一套键名，任何一边改动都要同步
  var K = {
    apiKey: "tap.apiKey",
    token: "tap.token",
    tokenExpires: "tap.tokenExpires",
    apiBase: "tap.apiBase",
    userId: "tap.userId",
    terminalId: "tap.terminalId"
  };

  var REFRESH_MS = 10000;
  var AUTH_LOST = "auth-lost";   // 专用错误标记：401 只该触发一次跳转

  var el = {
    terminal: document.getElementById("who-terminal"),
    logout: document.getElementById("logout-btn"),
    dot: document.getElementById("status-dot"),
    title: document.getElementById("status-title"),
    sub: document.getElementById("status-sub"),
    time: document.getElementById("status-time"),
    base: document.getElementById("m-base"),
    latency: document.getElementById("m-latency"),
    serverTime: document.getElementById("m-server-time"),
    queue: document.getElementById("m-queue"),
    count: document.getElementById("tasks-count"),
    updated: document.getElementById("tasks-updated"),
    table: document.getElementById("tasks-table"),
    tbody: document.getElementById("tasks-body"),
    state: document.getElementById("tasks-state"),
    refresh: document.getElementById("refresh-btn"),
    todo: document.getElementById("todo-body")
  };

  function apiBase() {
    return localStorage.getItem(K.apiBase) || "/v1";
  }

  function token() {
    return localStorage.getItem(K.token) || "";
  }

  function goLogin(reason) {
    // 先清 token 再跳，避免登录页又因为"有有效 token"把用户弹回来，形成死循环
    [K.token, K.tokenExpires, K.userId, K.terminalId].forEach(function (k) {
      localStorage.removeItem(k);
    });
    location.replace("index.html" + (reason ? "?expired=1" : ""));
  }

  /**
   * 统一请求入口：带 token、统一处理 401。
   * 401 一律回到登录页——员工看到的应该是"重新登录"，而不是一屏看不懂的错误。
   */
  function api(path, options) {
    var opt = options || {};
    var headers = { "Content-Type": "application/json" };
    if (token()) headers.Authorization = "Bearer " + token();
    return fetch(apiBase() + path, {
      method: opt.method || "GET",
      headers: headers,
      body: opt.body
    }).then(function (res) {
      if (res.status === 401) {
        goLogin(true);
        throw new Error(AUTH_LOST);
      }
      return res;
    });
  }

  function pad(n) { return ("0" + n).slice(-2); }

  /** ISO(UTC) 转本地「月-日 时:分」：看板上人只关心相对新鲜度 */
  function fmtTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function fmtClock(d) {
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  var STATUS_TEXT = {
    queued: "排队中",
    running: "执行中",
    done: "已完成",
    failed: "失败",
    cancelled: "已取消"
  };

  var TYPE_TEXT = { local: "本地", standard: "标准", sensitive: "高敏" };

  function statusNode(status) {
    var key = String(status || "").toLowerCase();
    var span = document.createElement("span");
    span.className = "st " + (STATUS_TEXT[key] ? key : "");
    span.textContent = STATUS_TEXT[key] || status || "未知";
    return span;
  }

  function typeNode(type) {
    var key = String(type || "").toLowerCase();
    var span = document.createElement("span");
    span.className = "badge " + (TYPE_TEXT[key] ? key : "");
    span.textContent = TYPE_TEXT[key] || type || "—";
    return span;
  }

  /* ---------------- 终端状态 ---------------- */

  function setHealth(kind, title, sub) {
    el.dot.className = "dot " + kind;
    el.title.textContent = title;
    el.sub.textContent = sub;
    el.time.textContent = "检测于 " + fmtClock(new Date());
  }

  /**
   * 探活分两级：
   * 一级 POST /heartbeat（能让服务端刷新终端在线信息，是最真实的"我能干活"信号）；
   * 心跳不可用（旧版服务端或路由未挂）时退回 GET /tasks——只要它能回话，网络与控制面就是通的。
   * 405 也算"活着"：说明请求到达了服务端，只是该路径没这个动词。
   */
  function probeHealth() {
    var started = performance.now();
    return api("/heartbeat", {
      method: "POST",
      body: JSON.stringify({
        version: "web-1.0",
        os: navigator.platform || "web",
        queue_len: 0
      })
    }).then(function (res) {
      var ms = Math.round(performance.now() - started);
      if (res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          el.latency.textContent = ms + " ms";
          el.serverTime.textContent = body.server_time ? fmtTime(body.server_time) : "—";
          el.queue.textContent = typeof body.queue_len === "number" ? String(body.queue_len) : "—";
          setHealth("online", "在线", "心跳正常，可接收任务");
        });
      }
      throw new Error("heartbeat HTTP " + res.status);
    }).catch(function (err) {
      if (err && err.message === AUTH_LOST) throw err;
      console.error("心跳探活失败，改用任务列表探活", err);
      return probeByTasks();
    });
  }

  function probeByTasks() {
    var started = performance.now();
    return api("/tasks?limit=1", { method: "GET" }).then(function (res) {
      var ms = Math.round(performance.now() - started);
      el.latency.textContent = ms + " ms";
      if (res.ok) {
        el.serverTime.textContent = "—";
        el.queue.textContent = "—";
        setHealth("degraded", "在线（降级）", "心跳不可用，已用任务列表验活");
      } else if (res.status === 405 || res.status === 404) {
        // 契约里定义了 GET /tasks，但服务端尚未实现时就是这个形态
        el.latency.textContent = ms + " ms";
        setHealth("degraded", "在线（降级）", "服务端可达，任务接口尚未开放（HTTP " + res.status + "）");
      } else {
        setHealth("offline", "异常", "服务端返回 HTTP " + res.status);
      }
      return res.status;
    }).catch(function (err) {
      if (err && err.message === AUTH_LOST) throw err;
      console.error("任务列表探活失败", err);
      el.latency.textContent = "—";
      setHealth("offline", "离线", "连不上服务端，请检查网络或服务地址");
      return 0;
    });
  }

  /* ---------------- 任务列表 ---------------- */

  /**
   * 空态/错误态。note 传 [{t:"text"|"code", v:"..."}] 这样的片段数组，
   * 全程用 textContent 建节点——不用 innerHTML，任何来源的字符串都进不了 HTML 解析器。
   */
  function showState(big, note) {
    el.table.hidden = true;
    el.state.hidden = false;
    el.state.textContent = "";

    var head = document.createElement("div");
    head.className = "big";
    head.textContent = big;
    el.state.appendChild(head);

    if (note && note.length) {
      var p = document.createElement("p");
      p.className = "note";
      note.forEach(function (part) {
        if (part.t === "code") {
          var code = document.createElement("code");
          code.textContent = part.v;
          p.appendChild(code);
        } else {
          p.appendChild(document.createTextNode(part.v));
        }
      });
      el.state.appendChild(p);
    }
  }

  function renderRows(tasks) {
    el.tbody.textContent = "";
    tasks.forEach(function (task) {
      // 契约里列表项尚未约定 body，字段名做兼容：id/task_id 都认
      var id = task.task_id || task.id || "—";
      var tr = document.createElement("tr");

      var tdId = document.createElement("td");
      tdId.className = "mono";
      tdId.textContent = id;
      tdId.title = id;

      var tdTitle = document.createElement("td");
      tdTitle.className = "title-cell";
      tdTitle.textContent = task.title || "（无标题）";

      var tdType = document.createElement("td");
      tdType.appendChild(typeNode(task.type || task.task_type));

      var tdStatus = document.createElement("td");
      tdStatus.appendChild(statusNode(task.status));

      var tdTime = document.createElement("td");
      tdTime.className = "mono";
      tdTime.textContent = fmtTime(task.created_at || task.created);

      [tdId, tdTitle, tdType, tdStatus, tdTime].forEach(function (td) { tr.appendChild(td); });
      el.tbody.appendChild(tr);
    });
  }

  function renderTodo(tasks) {
    var open = tasks.filter(function (t) {
      var s = String(t.status || "").toLowerCase();
      return s === "queued" || s === "running";
    });

    el.todo.textContent = "";
    if (!open.length) {
      var p = document.createElement("p");
      p.className = "todo-placeholder";
      p.textContent = "暂无待办。";
      el.todo.appendChild(p);
      return;
    }

    var ul = document.createElement("ul");
    open.slice(0, 8).forEach(function (task, index) {
      var li = document.createElement("li");

      var idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = ("0" + (index + 1)).slice(-2);

      var text = document.createElement("span");
      text.textContent = (task.title || "（无标题）") + " · " + (STATUS_TEXT[String(task.status || "").toLowerCase()] || task.status || "");

      li.appendChild(idx);
      li.appendChild(text);
      ul.appendChild(li);
    });
    el.todo.appendChild(ul);
  }

  function loadTasks() {
    return api("/tasks?limit=50", { method: "GET" }).then(function (res) {
      if (res.status === 405 || res.status === 404) {
        // 契约已定义、服务端待实现：如实说清楚，别让员工以为是网络问题
        el.count.textContent = "接口不可用";
        el.updated.textContent = "刷新于 " + fmtClock(new Date());
        showState(
          "任务接口尚未开放（HTTP " + res.status + "）",
          [
            { t: "text", v: "契约已定义 " },
            { t: "code", v: "GET /v1/tasks" },
            { t: "text", v: "，服务端尚未实现。接口上线后本页自动出现任务，无需改前端。" }
          ]
        );
        renderTodo([]);
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);

      return res.json().then(function (data) {
        // 列表体可能是裸数组，也可能包在 tasks/items 下，两种都接住
        var list = Array.isArray(data) ? data : (data.tasks || data.items || []);
        el.count.textContent = "共 " + list.length + " 条";
        el.updated.textContent = "刷新于 " + fmtClock(new Date());

        if (!list.length) {
          showState("暂无任务", [{ t: "text", v: "任务下发后会出现在这里；留空也只说明还没人派活。" }]);
          renderTodo([]);
          return;
        }

        el.state.hidden = true;
        el.table.hidden = false;
        renderRows(list);
        renderTodo(list);
      });
    }).catch(function (err) {
      if (err && err.message === AUTH_LOST) throw err;
      console.error("加载任务失败", err);
      el.count.textContent = "加载失败";
      showState("任务列表加载失败", [{ t: "text", v: "请稍后点「立即刷新」重试；持续失败请联系管理员查看服务端日志。" }]);
      renderTodo([]);
    });
  }

  var loadedOnce = false;

  /** 一轮刷新：状态卡与任务列表并行发起，互不阻塞 */
  function tick() {
    // 首次必须跑：用「新标签页后台打开」时 document.hidden 为真，
    // 若一律跳过就会永远停在"正在检测…"，等用户切回来才动。
    // 之后再隐藏才跳过，省掉后台无意义的轮询。
    if (document.hidden && loadedOnce) return Promise.resolve();
    loadedOnce = true;
    return Promise.all([probeHealth(), loadTasks()]).catch(function (err) {
      if (!err || err.message !== AUTH_LOST) console.error("刷新周期异常", err);
    });
  }

  /* ---------------- 启动 ---------------- */

  if (!token()) {
    goLogin(true);           // 没有 token 直接赶回登录页，连请求都不发
    return;
  }

  el.base.textContent = apiBase();
  el.terminal.textContent = localStorage.getItem(K.terminalId) || "—";

  el.logout.addEventListener("click", function () {
    [K.apiKey, K.token, K.tokenExpires, K.userId, K.terminalId].forEach(function (k) {
      localStorage.removeItem(k);
    });
    location.replace("index.html");
  });

  el.refresh.addEventListener("click", function () {
    el.refresh.disabled = true;
    tick().then(function () { el.refresh.disabled = false; });
  });

  // 回到前台立刻补一轮，避免看到过期数据
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) tick();
  });

  tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
</body>
</html>
